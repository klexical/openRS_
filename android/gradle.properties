org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true

# RC suffix — set to e.g. "rc.9" during pre-release, clear for stable
rcSuffix=

# Lint 8.7 (bundled with AGP 8.7.3) crashes on the lint checks shipped in Compose BOM 2025.11 /
# Lifecycle (Kotlin Analysis API mismatch). Run a newer lint without bumping AGP (#196).
android.experimental.lint.version=8.13.0
