name: Commit identity

# Every commit of a pull request to staging or main carries the owner's noreply address as author and committer, and no
# `Claude-Session:` line (owner Q141). Fails the PR otherwise. No secret is used; the script and its test run here.

on:
  pull_request:                      # never pull_request_target
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging, main]

permissions: {}

jobs:
  commit-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0             # the whole history: the check walks base..head
          persist-credentials: false

      - name: The check's own tests
        run: bash .github/scripts/test-check-commit-identity.sh

      - name: The review workflows' shape (Q137, Q141)
        run: ruby .github/scripts/test-review-workflows.rb

      - name: Every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-commit-identity.sh "$BASE" "$HEAD"
