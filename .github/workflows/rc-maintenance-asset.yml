name: RC maintenance asset

# Adds ONE separately named, higher-versionCode APK to an EXISTING prerelease, built from one pinned, reviewed source
# (rc.7 Build 38: openrs-2.2.7-rc.7-build38.apk on android-v2.2.7-rc.7). The release's tag, flags, notes and original
# asset (openRS_v2.2.7-rc.7.apk, Build 37) are never changed, replaced or re-uploaded: this job only adds a file and
# refuses when one of that name exists. ci.yml (and its tag-only publish-release) is separate and unchanged.
#
# Runs on every push to staging and does nothing unless the pushed tree is the pinned one: android/release-maintenance.json
# pins the tree of the commit without itself (android/scripts/rc-maintenance.sh source). The constants below must equal
# the marker's fields, so a marker edit alone can't redirect the job.

on:
  push:
    branches: [ staging ]

permissions: {}

concurrency:
  group: rc-maintenance-asset
  cancel-in-progress: false

env:
  MARKER: android/release-maintenance.json
  EXPECT_RELEASE_TAG: android-v2.2.7-rc.7
  EXPECT_RELEASE_TAG_COMMIT: 43ad5e157bc4ff3a88dd4dacc09ae12af25a4f19
  EXPECT_ORIGINAL_ASSET: openRS_v2.2.7-rc.7.apk
  EXPECT_ORIGINAL_ASSET_SHA256: eb937284564afb99c4b469a2d07d0c90885c3cb265a7bea6cd21591b9eb2464e
  EXPECT_ASSET_NAME: openrs-2.2.7-rc.7-build38.apk
  EXPECT_VERSION_NAME: 2.2.7-rc.7
  EXPECT_VERSION_CODE: '38'

jobs:
  maintenance-asset:
    name: Build, attest and add the maintenance APK
    runs-on: ubuntu-latest
    if: github.repository == 'klexical/openRS_'
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify-release.sh compares versionCode with every earlier android-v* tag

      - name: Pinned source?
        id: source
        run: bash scripts/rc-maintenance.sh source "$MARKER"

      - name: Release state (read-only)
        id: release
        if: steps.source.outputs.pinned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/rc-maintenance.sh release-before "$MARKER"
          [ "$(git rev-parse "$EXPECT_RELEASE_TAG^{commit}")" = "$EXPECT_RELEASE_TAG_COMMIT" ] \
            || { echo "::error::local tag $EXPECT_RELEASE_TAG is not $EXPECT_RELEASE_TAG_COMMIT"; exit 1; }

      - name: Already added
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'true'
        run: echo "::notice::$EXPECT_ASSET_NAME is already on $EXPECT_RELEASE_TAG — nothing to do (never replaced)"

      - name: Set up JDK 17
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Same secrets as ci.yml's publish-release; unlike that job, a missing keystore is an error — this job uploads.
      - name: Decode release keystore
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Keystore secrets not configured — refusing to build an unsigned maintenance asset"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > openrs-release.jks
          printf 'storeFile=openrs-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Check release configuration (API keys)
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: bash scripts/check-release-config.sh

      - name: Unit tests and release APK
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: chmod +x gradlew && ./gradlew test assembleRelease --no-daemon

      # verify-release.sh takes the tag as its argument: filename, versionName, signer and Maps key against the existing
      # rc.7 tag. Its versionCode rule skips the tag it is given (it was written for that tag's own build), so the next
      # step also checks the code against the rc.7 tag's own.
      - name: Verify release identity (tag, versionName, filename, versionCode, signer, Maps key)
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        run: bash scripts/verify-release.sh "$EXPECT_RELEASE_TAG" "app/build/outputs/apk/release/openRS_v$EXPECT_VERSION_NAME.apk"

      - name: Verify maintenance identity (package, versionCode above the tag's own)
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        run: |
          APK="app/build/outputs/apk/release/openRS_v$EXPECT_VERSION_NAME.apk"
          bash scripts/check-apk-maps-key.sh "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          B=$("$BT/aapt2" dump badging "$APK" | awk 'NR==1')
          echo "$B"
          [ "$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<<"$B")" = "com.openrs.dash" ] || { echo "::error::package is not com.openrs.dash"; exit 1; }
          [ "$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$B")" = "$EXPECT_VERSION_CODE" ] || { echo "::error::versionCode is not $EXPECT_VERSION_CODE"; exit 1; }
          [ "$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$B")" = "$EXPECT_VERSION_NAME" ] || { echo "::error::versionName is not $EXPECT_VERSION_NAME"; exit 1; }
          TAG_CODE=$(git show "$EXPECT_RELEASE_TAG:android/app/build.gradle.kts" | grep -oE 'releaseVersionCode *= *[0-9]+' | grep -oE '[0-9]+$')
          [ "$EXPECT_VERSION_CODE" -gt "$TAG_CODE" ] || { echo "::error::versionCode $EXPECT_VERSION_CODE is not above $EXPECT_RELEASE_TAG's $TAG_CODE"; exit 1; }
          echo "Maintenance identity OK: com.openrs.dash $EXPECT_VERSION_NAME versionCode $EXPECT_VERSION_CODE (> $TAG_CODE at $EXPECT_RELEASE_TAG)"

      - name: Name the maintenance asset
        id: asset
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/asset"
          OUT="$RUNNER_TEMP/asset/$EXPECT_ASSET_NAME"
          cp "app/build/outputs/apk/release/openRS_v$EXPECT_VERSION_NAME.apk" "$OUT"
          rm -f keystore.properties openrs-release.jks
          sha256sum "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.asset.outputs.path }}

      # Adds the one file. No --clobber: gh refuses an existing name, and the check before it fails first.
      - name: Add the asset to the existing release
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.asset.outputs.path }}
        run: |
          bash scripts/rc-maintenance.sh release-upload "$MARKER"
          gh release upload "$EXPECT_RELEASE_TAG" "$APK" --repo "$GITHUB_REPOSITORY"

      - name: Verify the release after the upload (read-only)
        if: steps.source.outputs.pinned == 'true' && steps.release.outputs.uploaded == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.asset.outputs.path }}
        run: bash scripts/rc-maintenance.sh release-after "$MARKER" "$APK"
