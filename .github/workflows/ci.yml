name: CI

on:
  push:
    branches: [ main, staging ]
    tags: [ 'android-v*' ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        id: unit-tests
        # --continue: a failing variant doesn't stop the other one, so both report sets exist (the step still fails)
        run: ./gradlew test --no-daemon --continue

      # A failed unit-test run keeps Gradle's reports, so a failure that only happens on CI (class order, timing) comes with
      # its stack. One artifact per variant; a missing folder (e.g. the tests didn't compile) is a visible warning.
      # Contents: test names, assertion messages, stack traces and test stdout from this checkout only (the build job has no
      # secrets or API keys).
      - name: Upload unit-test reports (debug)
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-debug-attempt-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test reports (release)
        if: failure() && steps.unit-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-release-attempt-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/testReleaseUnitTest/
            android/app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Test the release configuration check
        run: bash scripts/test-release-config.sh

      # The release scripts' own tests (#362, #363): the nightly identity rule in the build file (runs Gradle; edits
      # app/build.gradle.kts for one case and restores it byte for byte), verify-release.sh against a throwaway tag
      # history, the shared recipe's build step, and the release workflows' shape. No secrets, no APK.
      - name: Test the release identity rule
        run: bash scripts/test-release-identity.sh

      - name: Test the release check (verify-release.sh)
        run: bash scripts/test-verify-release.sh

      - name: Test the release recipe (release-apk.sh)
        run: bash scripts/test-release-apk.sh

      - name: Test the release workflows' shape
        run: ruby scripts/test-release-workflows.rb

      - name: Test the nightly gate and launch check
        run: |
          bash scripts/test-nightly-gate.sh
          bash scripts/test-launch-check.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: openRS-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run lint
        run: chmod +x gradlew && ./gradlew lint --no-daemon

  release:
    name: Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [ build, lint ]
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      # Gradle renames release APKs to openRS_v{versionName}.apk (see app/build.gradle.kts)
      # NOTE: working-directory is already `android/` (job defaults), so paths must be relative to it.
      # (upload-artifact below resolves paths from the repo root, so it keeps `android/`.)
      - name: Verify release APK exists
        run: |
          ls -la app/build/outputs/apk/release/openRS_v*.apk
          test -n "$(ls app/build/outputs/apk/release/openRS_v*.apk 2>/dev/null)" || {
            echo "::error::Expected openRS_v*.apk in release/ — check build.gradle.kts outputFileName"
            exit 1
          }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: openRS-release
          path: android/app/build/outputs/apk/release/openRS_v*.apk
          retention-days: 30

  # An android-v RC or stable tag: the shared recipe builds and verifies the APK (.github/workflows/release-apk.yml,
  # #363), then publish-release attests it and attaches it to the tag's GitHub release. A nightly tag is skipped here:
  # nightlies are built and published by the nightly workflow #363 adds, not by this file.
  release-name:
    name: Release name from the tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v') && !contains(github.ref_name, '-nightly.')
    permissions: {}
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - name: Release name
        id: name
        env:
          TAG: ${{ github.ref_name }}
        run: echo "name=${TAG#android-v}" >> "$GITHUB_OUTPUT"

  release-apk:
    name: Build release APK (tag)
    if: startsWith(github.ref, 'refs/tags/android-v') && !contains(github.ref_name, '-nightly.')
    needs: [ build, lint, release-name ]
    permissions:
      contents: read
    uses: ./.github/workflows/release-apk.yml
    with:
      sha: ${{ github.sha }}
      name: ${{ needs.release-name.outputs.name }}
      tag: ${{ github.ref_name }}
      nightly_date: ''   # an RC or stable: no -PnightlyDate at all (the build refuses an empty one, #362)
    secrets: inherit

  publish-release:
    name: Attach APK to GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/android-v') && !contains(github.ref_name, '-nightly.')
    needs: [ release-apk ]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download the release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk-${{ github.run_id }}-${{ github.run_attempt }}   # the recipe's upload name in this run
          path: release-apk

      # The file the recipe verified, byte for byte: the name the tag gives it and the SHA-256 the recipe reported (its only
      # output: GitHub drops an output holding a secret's value, so the names are built here, not passed)
      - name: Check the downloaded APK
        id: apk
        env:
          SHA256: ${{ needs.release-apk.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE="openRS_v${TAG#android-v}.apk"
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the recipe reported no SHA-256 ('$SHA256')"; exit 1; }
          [ "$(ls release-apk)" = "$FILE" ] || { echo "::error::the artifact does not hold exactly $FILE: $(ls release-apk | tr '\n' ' ')"; exit 1; }
          echo "$SHA256  release-apk/$FILE" | sha256sum -c -
          echo "path=release-apk/$FILE" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}

  verify-firmware:
    name: Verify Firmware Binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for manifest files
        id: check
        run: |
          if ls firmware/release/BUILD_MANIFEST_*.json 1>/dev/null 2>&1; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify firmware binaries match manifest
        if: steps.check.outputs.has_manifest == 'true'
        run: bash firmware/verify-release.sh

      - name: Fail if binaries exist without manifest
        run: |
          for bin in firmware/release/openrs-fw-*.bin; do
            [ -f "$bin" ] || continue
            NAME=$(basename "$bin")
            TARGET_HINT=$(echo "$NAME" | sed -n 's/openrs-fw-\(usb\|pro\)_.*/\1/p')
            if [ -n "$TARGET_HINT" ] && [ ! -f "firmware/release/BUILD_MANIFEST_${TARGET_HINT}.json" ]; then
              echo "::error::$NAME exists but BUILD_MANIFEST_${TARGET_HINT}.json is missing — binary may be stale. Rebuild with: ./build.sh --target $TARGET_HINT"
              exit 1
            fi
          done
          echo "All firmware binaries have matching manifests."
