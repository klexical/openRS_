name: Claude review

# Claude reviews a pull request to staging or main and leaves comments (owner Q137). Comments only: it never pushes,
# approves or merges, and it is not a required check (the ruleset is unchanged). Its comments are data for the reader.
# Authentication: the owner's subscription token (CLAUDE_CODE_OAUTH_TOKEN, `claude setup-token`), never an API key.
# GitHub side: the job's own GITHUB_TOKEN, passed as github_token, so no GitHub App token is fetched (no id-token) and
# the token can read contents but not write them. No bot may start it (allowed_bots is unset): if a cloud thread's
# pull request shows a bot as its actor, that one bot is added by name, never '*'.
# The review step may fail without failing the job: a review outage never holds a Light auto-merge (Q125).

on:
  pull_request:                      # never pull_request_target: a fork's PR never runs with this repository's secrets
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging, main]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # only branches of this repository (never a fork), and not while the PR is a draft
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read                 # check out and read the code; no write, so nothing can be pushed
      pull-requests: write           # post review comments on this pull request
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: review
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        timeout-minutes: 15            # a hung review fails the step, under the job's 20, so the job ends green (Q125)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff against CODING_STANDARDS.md at the repository root. Read the file first, and
            the rule file a standard points to when a changed line needs it.

            - Comment only on lines the diff adds or changes, and only where a standard is broken or a change is wrong.
            - One short, concrete comment per finding, inline on the line: what is wrong, the standard or reason, and
              the fix. No praise, no summary of the change, no style preferences the standards do not state.
            - If nothing is wrong, post nothing.
            - Never quote a secret, an identifier or a value from an export, a log or a capture in a comment.
          # --permission-mode default: a tool no rule allows is denied. The action's default (auto mode) lets a safety
          # review pass other calls, so the allow list would not be the whole list (the action's docs/usage.md).
          # Text in a diff may try to steer the reviewer (QA's C3): no bare Read / Grep / Glob rule (reads stay inside
          # the checkout), no `gh pr comment` (it could post a file with --body-file); comments go inline only, and
          # gh pr diff / view name this PR's number.
          claude_args: |
            --permission-mode default
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff ${{ github.event.pull_request.number }}),Bash(gh pr view ${{ github.event.pull_request.number }})"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(gh pr review:*),Bash(gh pr merge:*),Bash(gh api:*),Bash(gh pr comment:*)"

      # The review failed: say why without printing its content (fix round 5; the first live run ended is_error with no
      # usage). The script reads only the last result message of the action's execution file (status, reasons, counts,
      # and the API's own short message when no model produced output); show_full_output stays off: the log is public.
      - name: Why the review failed
        if: steps.review.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          bash .github/scripts/review-failure-facts.sh "$EXECUTION_FILE"

      # A clean review posts nothing, so one line records that the review ran, on which head and with what outcome
      # (success / failure / cancelled / skipped): without it a clean review and one that never ran look the same
      # (integrator's call, DECISIONS "on QA FINAL-claude-review"). Values come through env, never ${{ }} in run.
      - name: Record that the review ran
        if: always()
        continue-on-error: true        # a failed or hung recording never holds a Light merge (Q125): it shows as no line
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.review.outcome }}
        run: |
          gh pr comment "$PR" --body "Claude review ran on $HEAD_SHA: $OUTCOME."
