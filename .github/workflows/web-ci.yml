name: Sapphire Web CI

# Checks for the Sapphire web dashboard (web/). Separate from ci.yml (Android / firmware) and from deploy-pages.yml
# (builds and deploys main to GitHub Pages): this workflow never deploys and uses no secrets.
#
# It runs on every pull request to main or staging, so main's ruleset can require the check "Sapphire": a workflow left
# out by `on.paths` never reports and would hold every other pull request (research: single required check, Q99). The
# first step works out from git whether the pull request changes web/ or this file; when it does not, every later step
# is skipped and the job passes in seconds. A failure of that step fails the job (never a skip). The job's name is the
# required check's name, so it names no Node version.

on:
  pull_request:
    branches: [ main, staging ]
    types: [ opened, synchronize, reopened, edited ]   # edited: a pull request retargeted onto another base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Sapphire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0             # the whole history: the decision needs the merge base of the event's base and head

      # What the pull request changes is its head against its merge base with the event's base commit (BASE...HEAD). The
      # test merge commit's first parent is not used for that: on a pull request retargeted onto another base, the
      # `edited` run's merge commit can still sit on the old base (seen twice on a scratch pull request). The event's base
      # commit can also lag that first parent when the base branch moved on (seen on #473: the merge commit was on main's
      # tip, the event named an older main commit). So when the checks would run, the step makes sure the checked-out
      # commit is GitHub's merge of the event's head, and that its base is on the base branch at or past the event's base
      # commit, and fails otherwise, since the checks would build the wrong tree. git itself matches the paths (no listing of names, which git quotes when they are not ASCII); --no-renames
      # counts both sides of a move, so a file moved out of web/ counts.
      # git diff --quiet: 1 = a change (run), 0 = none (skip), anything else = an error (the step fails).
      - name: Does this pull request change web/ or this workflow?
        id: diff
        working-directory: .
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::the event names no base branch, base commit or head commit"; exit 1; }
          rc=0
          git diff --quiet --no-renames "$BASE_SHA...$HEAD_SHA" -- web .github/workflows/web-ci.yml || rc=$?
          case "$rc" in
            1) [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$HEAD_SHA" ] || { echo "::error::the checked-out commit is not GitHub's test merge of this pull request's head, so the checks would build another tree"; exit 1; }
               branch="refs/remotes/origin/$BASE_REF"
               git rev-parse --verify -q "$branch^{commit}" > /dev/null || { echo "::error::the checkout has no copy of the base branch $BASE_REF"; exit 1; }
               if ! git merge-base --is-ancestor "$BASE_SHA" 'HEAD^1' || ! git merge-base --is-ancestor 'HEAD^1' "$branch"; then
                 echo "::error::GitHub's test merge commit is not on this pull request's base branch $BASE_REF at or past the event's base commit (a retarget can leave it on the old base, and the base can move between GitHub's merge and the event), so the checks would build the wrong tree: push a new commit (a re-run replays the same merge commit)"
                 exit 1
               fi
               echo run=true >> "$GITHUB_OUTPUT" ;;
            0) echo run=false >> "$GITHUB_OUTPUT"
               echo "No change under web/ or to this workflow: the Sapphire steps are skipped." ;;
            *) echo "::error::git diff failed (exit $rc)"; exit 1 ;;
          esac

      - name: Setup Node
        if: steps.diff.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (lockfile)
        if: steps.diff.outputs.run == 'true'
        run: npm ci

      - name: Unit tests (vitest)
        if: steps.diff.outputs.run == 'true'
        run: npm test

      - name: Lint (ESLint)
        if: steps.diff.outputs.run == 'true'
        run: npm run lint

      - name: Type check (tsc -b)
        if: steps.diff.outputs.run == 'true'
        run: npx tsc -b

      - name: Production build
        if: steps.diff.outputs.run == 'true'
        run: npm run build
