name: Sapphire Web CI

# Checks for the Sapphire web dashboard (web/). Separate from ci.yml (Android / firmware) and from deploy-pages.yml
# (builds and deploys main to GitHub Pages): this workflow never deploys and uses no secrets.
#
# It runs on every pull request to main or staging, so main's ruleset can require the check "Sapphire": a workflow left
# out by `on.paths` never reports and would hold every other pull request (research: single required check, Q99). The
# first step works out from git whether the pull request changes web/ or this file; when it does not, every later step
# is skipped and the job passes in seconds. A failure of that step fails the job (never a skip). The job's name is the
# required check's name, so it names no Node version.

on:
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Sapphire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2             # GitHub's test merge commit and its two parents

      # On a pull request HEAD is GitHub's test merge commit of the head into the base tip, its first parent, so
      # HEAD^1..HEAD is what the pull request changes now. --no-renames lists both sides of a move, so a file moved out
      # of web/ still counts.
      - name: Does this pull request change web/ or this workflow?
        id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git rev-parse --verify -q 'HEAD^2' > /dev/null || { echo "::error::HEAD is not the test merge commit"; exit 1; }
          files=$(git diff --no-renames --name-only 'HEAD^1' HEAD)
          if grep -qE '^(web/|\.github/workflows/web-ci\.yml$)' <<< "$files"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
            echo "No change under web/ or to this workflow: the Sapphire steps are skipped."
          fi

      - name: Setup Node
        if: steps.diff.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (lockfile)
        if: steps.diff.outputs.run == 'true'
        run: npm ci

      - name: Unit tests (vitest)
        if: steps.diff.outputs.run == 'true'
        run: npm test

      - name: Lint (ESLint)
        if: steps.diff.outputs.run == 'true'
        run: npm run lint

      - name: Type check (tsc -b)
        if: steps.diff.outputs.run == 'true'
        run: npx tsc -b

      - name: Production build
        if: steps.diff.outputs.run == 'true'
        run: npm run build
